</style></head><body>
<header><div><h1 id="workspace">SAGA</h1><p>Requests, decisions, and follow-through.</p></div><div class="header-controls"><div class="header-actions"><button id="refreshButton">Refresh</button><button id="syncButton">Sync now</button><button id="pushHeader">Push now</button><label id="gitControls" hidden><input id="autoPushHeader" type="checkbox"> Auto push</label></div><div id="gitStatus" class="sync" aria-live="polite"></div><div id="sync" class="sync" role="status">Connecting…</div></div></header>
<div class="shell"><aside id="navigation"><p class="caption">Your workspace</p><button data-view="inbox">Inbox</button><button data-view="outbox">Your outbox</button><button data-view="requests">Requests</button><button data-view="approvals">Completion review</button><p class="caption" style="margin-top:28px">Observe</p><button data-view="monitor">Participant monitoring</button><button data-view="history">Git history</button><button data-view="settings">Settings</button><p class="hint" id="identity"></p></aside>
<main><div class="heading"><div><h2 id="title">Inbox</h2><div class="muted" id="subtitle"></div></div><div class="branch-position"><span id="branch" class="muted"></span><details id="branchPanel"><summary id="branchSummary">Branches</summary><div class="branch-popover"><p class="hint" id="branchRefreshHint">Compared with your current inbox.</p><button id="checkBranches">Fetch and check branches</button><div id="branchList"></div></div></details></div></div><div id="notice" class="notice" role="alert"></div><div class="stats" id="stats"></div>
<div class="toolbar" id="toolbar"><input id="search" placeholder="Search messages…" aria-label="Search"><select id="participant" aria-label="Filter participant"></select><select id="status" aria-label="Filter status"><option value="all">All statuses</option><option>untriaged</option><option>open</option><option>in_progress</option><option>waiting</option><option>blocked</option><option>done</option></select><button id="taskFilter">Tasks only</button><div id="filterTags" class="filter-tags"></div></div>
<div class="columns" id="columns"><section id="feed"></section><section class="card compose" id="compose" inert><div id="composeHandle" class="compose-heading"><h3>New message</h3><button id="detachCompose" aria-label="Float composer" title="Float composer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M14 3h7v7M21 3l-9 9"/></svg></button></div><p class="hint" id="replyHint">Send from your configured identity.</p><select id="recipient" aria-label="Recipient"></select><input id="subject" placeholder="Subject" maxlength="200" aria-label="Subject"><div class="pair"><select id="kind" aria-label="Message kind"><option>request</option><option>question</option><option>decision</option><option>report</option><option>reply</option></select><select id="priority" aria-label="Priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></div><textarea id="message" placeholder="Write a message…&#10;&#10;- [ ] A task to follow" aria-label="Message body"></textarea><div class="actions"><button id="task">+ Task</button><button id="cancelReply" hidden>Cancel reply</button><button class="primary" id="send">Send</button></div><p class="hint" id="savePolicy"></p></section></div></main></div>
<dialog id="fileViewer" aria-label="File preview"><div class="file-heading"><div><h3 id="fileTitle"></h3><span id="fileContext" class="hint"></span></div><button id="closeFile">Close preview</button></div><div id="fileContent" class="body"></div></dialog>
<dialog id="editor"><h3>Edit your message</h3><p class="hint">Editing invalidates any completion receipt for an older version.</p><textarea id="editBody" aria-label="Edit message"></textarea><div class="actions"><button id="cancelEdit">Cancel</button><button id="saveEdit" class="primary">Save and commit</button></div></dialog>

<script>
const token='__TOKEN__', $=id=>document.getElementById(id);let state,view='inbox',busy=false,signature='',tasksOnly=false,replyTo=null,editing=null,confirmation=null,historyState=null,refreshTimer=null,pageIndex=0;const participantFilters=new Set(),statusFilters=new Set();let floating=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=id=>state.config.participants.find(p=>p.id===id)?.label||id;
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const date=s=>new Date(s).toLocaleString('en-GB',{timeZone:state.config.timeZone});
async function api(route,data){const r=await fetch('/api/'+route,{method:data!==undefined?'POST':'GET',headers:{'X-Dashboard-Token':token,...(data!==undefined?{'Content-Type':'application/json'}:{})},body:data!==undefined?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error);return x;}
function notice(s){$('notice').textContent=s;$('notice').style.display=s?'block':'none';}
function choices(id,people,all=false){const old=$(id).value;$(id).innerHTML=(all?'<option value="all">All participants</option>':'')+people.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');if([...$(id).options].some(o=>o.value===old))$(id).value=old;}
function body(text,record=null,editable=false){return renderMarkdown(text,record,editable);}

function messageCard(r,open=false,nested=false){const m=r.meta,own=m.from===state.config.identity,editable=own&&view!=='monitor',replies=nested?[]:state.messages.filter(x=>x.meta.reply_to===m.id&&x.meta.kind!=='receipt');return `<details class="card message-card" ${open?'open':''}><summary><div class="summary-content"><div class="meta-row"><span class="tag">${esc(nested||view==='monitor'?label(m.from)+' → '+label(m.to):view==='requests'?(own?'To '+label(m.to):'From '+label(m.from)):view==='inbox'?label(m.from):label(m.to))} · ${date(m.created)}</span><span class="badge">${esc(m.kind)}</span><span class="badge">${esc(m.status.replaceAll('_',' '))}</span>${m.priority!=='normal'?'<span class="badge warn">'+esc(m.priority)+'</span>':''}</div><div class="message-title">${inline(m.title)}</div></div></summary><div class="body">${body(r.body,r,editable)}<p class="hint">${esc(m.id)}${m.reply_to?' · reply to '+esc(m.reply_to):''}</p><div class="actions">${editable?`<button data-edit="${esc(m.id)}">Edit</button><select data-status="${esc(m.id)}" aria-label="Message status">${['untriaged','open','in_progress','waiting','blocked','done'].map(s=>'<option '+(s===m.status?'selected':'')+'>'+s+'</option>').join('')}</select><button class="danger" data-close="${esc(m.id)}">Close and remove</button>`:m.to===state.config.identity&&view!=='monitor'?`<button data-reply="${esc(m.id)}">Reply</button>`:''}</div>${replies.length?'<div class="replies"><p class="caption">Replies</p>'+replies.map(x=>messageCard(x,false,true)).join('')+'</div>':''}</div></details>`;}
function matches(r){const q=$('search').value.toLowerCase();const person=view==='inbox'?r.meta.from:view==='outbox'?r.meta.to:view==='requests'?(r.meta.to===state.config.identity?r.meta.from:r.meta.to):null;return (!participantFilters.size||(person?participantFilters.has(person):[r.meta.from,r.meta.to].some(id=>participantFilters.has(id))))&&(!statusFilters.size||statusFilters.has(r.meta.status))&&(!tasksOnly||/^\s*(?:[-*+]|\d+[.)]) \[[ xX]\]/m.test(r.body))&&(r.meta.title+' '+r.body+' '+r.meta.id).toLowerCase().includes(q);}
function renderFilters(){$('filterTags').innerHTML=[...participantFilters].map(id=>'<button data-filter="participant" data-value="'+esc(id)+'">'+esc(label(id))+' ×</button>').join('')+[...statusFilters].map(id=>'<button data-filter="status" data-value="'+esc(id)+'">'+esc(id.replaceAll('_',' '))+' ×</button>').join('')+((participantFilters.size||statusFilters.size)?'<button id="clearFilters">Clear filters</button>':'');}
function renderBranches(){const list=state.branches||[];const total=list.reduce((n,b)=>n+(b.newMessages||0)+(b.updatedMessages||0),0);$('branchSummary').textContent=total?total+' updates on other branches':'Branches';$('branchSummary').classList.toggle('has-updates',total>0);$('branchRefreshHint').textContent=state.branchRefresh?.error?'Refresh failed: '+state.branchRefresh.error:state.branchRefresh?.last?'Last remote check: '+new Date(state.branchRefresh.last).toLocaleString('en-GB'):'Remote results reflect the last fetch. Compared with your current inbox.';$('branchList').innerHTML=list.map(b=>'<div class="branch-row"><span><strong>'+esc(b.name)+'</strong> · '+(b.error?esc(b.error):b.newMessages+' new · '+b.updatedMessages+' updated')+'</span><button data-switch-branch="'+esc(b.ref)+'" '+(b.error?'disabled':'')+'>Switch</button></div>').join('')||'<p class="hint">No other discovered mailbox branches.</p>';}

function render(){
 if(state.setupRequired){$('branchPanel').hidden=true;$('pushHeader').disabled=true;document.title='SAGA';$('workspace').textContent='SAGA';$('title').textContent='Set up your workspace';$('subtitle').textContent='Choose the repository holding your messages.';$('navigation').hidden=true;$('stats').innerHTML='';$('toolbar').hidden=true;$('compose').hidden=true;$('columns').classList.add('wide');$('feed').innerHTML=renderSetup();return;}
 $('branchPanel').hidden=!state.config.discoverBranches;$('pushHeader').disabled=false;$('navigation').hidden=false;$('gitControls').hidden=false;const g=state.git;if(g){$('gitStatus').textContent=g.changedFiles+' uncommitted files · '+(g.ahead===null?'remote status unavailable':g.ahead+' commits to push · '+g.behind+' behind')+(state.publicationHold?(g.ahead===0?' · auto push paused':' · publication paused'):'');$('autoPushHeader').checked=state.config.autoPush;}
 const c=state.config,me=c.identity;$('savePolicy').textContent=(c.autoCommit?'Changes are committed automatically.':'Changes are saved to files; commit them when ready.')+' Drafts stay in this browser.';$('saveEdit').textContent=c.autoCommit?'Save and commit':'Save changes';document.title='SAGA · '+c.title;$('workspace').textContent='SAGA / '+c.title;$('identity').textContent='Operating as '+label(me);$('branch').textContent='Branch: '+state.branch;
 const titles={requests:['Requests','Standalone requests and questions addressed to you or sent by you. Reports remain in Inbox and Your outbox.'],inbox:['Inbox','Messages addressed to you. Completion receipts appear in Completion review.'],outbox:['Your outbox','You own these requests and decide when to remove them.'],approvals:['Completion review','Receipts certify an exact message version. Review the work before cleanup.'],monitor:['Participant monitoring','Read-only exchanges between other participants.'],history:['Git history','Inspect mailbox snapshots before or after a commit.'],settings:['Settings','Configure this workspace and every automatic action.']};
 $('title').textContent=titles[view][0];$('subtitle').textContent=titles[view][1];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 choices('participant',c.participants,true);$('participant').options[0].textContent='Add participant filter';$('status').options[0].textContent='Add status filter';renderFilters();renderBranches();choices('recipient',c.participants.filter(p=>p.id!==me));const outgoing=state.messages.filter(r=>r.meta.from===me&&r.meta.kind!=='receipt'),incoming=state.messages.filter(r=>r.meta.to===me&&r.meta.kind!=='receipt'),ready=state.candidates.filter(r=>r.eligible);
 document.querySelector('[data-view="monitor"]').hidden=!c.showMonitoring;
 $('stats').innerHTML=[[incoming.length,'inbox messages'],[outgoing.length,'outbox messages'],[ready.length,'completed requests'],[state.errors.length,'format errors']].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span class="muted">${t}</span></div>`).join('');
 const showCompose=['inbox','outbox','requests'].includes(view);$('compose').hidden=!showCompose;$('columns').classList.toggle('wide',!showCompose||floating);$('toolbar').hidden=!['inbox','outbox','requests','monitor'].includes(view);$('taskFilter').classList.toggle('primary',tasksOnly);
 if(state.errors.length)notice(state.errors.join('\n'));
 if(view==='settings'){$('feed').innerHTML=renderSettings(c);return;}
 if(view==='approvals'){$('feed').innerHTML='<p class="hint">Cleanup policy: '+esc(c.cleanup)+'. Each receipt includes the agent’s completion summary.</p>'+state.candidates.map(a=>`<details class="card" open><summary><span class="tag">${esc(label(a.receipt.meta.from))} · ${date(a.receipt.meta.created)}</span>${inline(a.request?.meta.title||a.receipt.meta.title)} <span class="badge ${a.eligible?'':'warn'}">${a.eligible?'Ready for cleanup':esc(a.reason)}</span></summary><div class="body"><p class="caption">Completion summary</p>${body(a.receipt.body)}${a.request?'<details><summary>Original request</summary>'+body(a.request.body)+'</details>':''}<div class="actions">${a.eligible&&c.cleanup!=='off'?'<button class="primary" data-approve="'+esc(a.receipt.meta.id)+'">Approve and clean up</button>':''}<button data-dismiss="${esc(a.receipt.meta.id)}">Dismiss receipt</button></div></div></details>`).join('');if(!state.candidates.length)$('feed').innerHTML+='<div class="card empty">No completion receipts yet.</div>';return;}
 if(view==='history'){renderHistory();return;}
 const records=(view==='inbox'?incoming:view==='outbox'?outgoing:view==='requests'?state.messages.filter(r=>['request','question'].includes(r.meta.kind)&&(r.meta.to===me||r.meta.from===me)):state.messages.filter(r=>r.meta.from!==me&&r.meta.to!==me)).filter(matches).sort((a,b)=>b.meta.created.localeCompare(a.meta.created));
 const pages=Math.max(1,Math.ceil(records.length/c.pageSize));pageIndex=Math.min(pageIndex,pages-1);
 $('feed').innerHTML=records.slice(pageIndex*c.pageSize,(pageIndex+1)*c.pageSize).map((r,i)=>messageCard(r,i<c.defaultExpanded)).join('')+(records.length>c.pageSize?'<div class="actions"><button id="previousPage" '+(pageIndex===0?'disabled':'')+'>Previous</button><span class="hint">Page '+(pageIndex+1)+' of '+pages+' · '+records.length+' messages</span><button id="nextPage" '+(pageIndex===pages-1?'disabled':'')+'>Next</button></div>':'');if(!$('feed').innerHTML)$('feed').innerHTML='<div class="card empty">No messages match this view.</div>';
}
function renderHistory(){if(!historyState){$('feed').innerHTML='<div class="card empty">Loading history…</div>';return;}$('feed').innerHTML=historyState.commits.map(c=>`<section class="card panel"><span class="tag">${date(c.date)} · ${esc(c.commit.slice(0,8))}</span><strong>${esc(c.title)}</strong>${c.files.map(f=>`<p class="hint">${esc(f)}</p><button data-history="${esc(c.commit)}" data-file="${esc(f)}" data-before="true">Before</button> <button data-history="${esc(c.commit)}" data-file="${esc(f)}">After</button>`).join('')}<pre id="snapshot-${esc(c.commit)}" hidden></pre></section>`).join('')||'<div class="card empty">No structured mailbox history yet.</div>';}
async function refresh(force=false){try{const next=await api('state');const status=next.sync||{message:'Choose a repository'};$('sync').textContent=status.message+(status.last?' · '+new Date(status.last).toLocaleTimeString('en-GB'):'');$('sync').classList.toggle('error',status.state==='error');const key=next.setupRequired?JSON.stringify(next):JSON.stringify([next.branchRefresh,next.branches,next.git,next.publicationHold,next.configVersion,next.messages.map(r=>r.sha256),next.errors]);const changedIdentity=state?.config?.identity!==next.config?.identity,changedContext=state?.workspaceRoot!==next.workspaceRoot||state?.branch!==next.branch;state=next;if(changedIdentity&&next.config){$('kind').value=next.config.defaultKind;$('priority').value=next.config.defaultPriority;pageIndex=0;}if(force||key!==signature){signature=key;render();}if(next.config&&(changedIdentity||changedContext))loadDraft();}catch(e){notice(e.message);}finally{scheduleRefresh();}}
function scheduleRefresh(){clearTimeout(refreshTimer);if(state?.config?.refreshSeconds>0)refreshTimer=setTimeout(()=>{if(!busy)refresh();else scheduleRefresh();},state.config.refreshSeconds*1000);}
async function mutate(route,data){if(busy)return false;busy=true;$('send').disabled=true;notice('');try{await api(route,data);historyState=null;return true;}catch(e){notice(e.message);return false;}finally{busy=false;$('send').disabled=false;await refresh(true);}}
function confirmAction(title,text,fn){confirmation=fn;$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmation').showModal();}
$('cancelConfirm').onclick=()=>{$('confirmation').close();confirmation=null;};$('acceptConfirm').onclick=()=>{$('confirmation').close();const fn=confirmation;confirmation=null;fn?.();};
$('navigation').onclick=async e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;pageIndex=0;render();if(view==='history'){try{historyState=await api('history',{});if(view==='history')renderHistory();}catch(e){notice(e.message);}}};
$('search').oninput=()=>{pageIndex=0;render();};$('participant').onchange=()=>{if($('participant').value!=='all')participantFilters.add($('participant').value);$('participant').value='all';pageIndex=0;render();};$('status').onchange=()=>{if($('status').value!=='all')statusFilters.add($('status').value);$('status').value='all';pageIndex=0;render();};$('taskFilter').onclick=()=>{tasksOnly=!tasksOnly;render();};
$('filterTags').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='clearFilters'){participantFilters.clear();statusFilters.clear();}else (b.dataset.filter==='participant'?participantFilters:statusFilters).delete(b.dataset.value);pageIndex=0;render();};
$('checkBranches').onclick=async()=>{if(busy)return;$('checkBranches').disabled=true;try{await api('branches',{fetch:true});await refresh(true);}catch(e){notice(e.message);}finally{$('checkBranches').disabled=false;}};
$('branchList').onclick=e=>{const b=e.target.closest('[data-switch-branch]');if(!b)return;confirmAction('Switch branch?','Files must be committed and pending dashboard commits published. Your draft stays attached to the current branch.',async()=>{saveDraft();if(await mutate('branch',{ref:b.dataset.switchBranch})){participantFilters.clear();statusFilters.clear();render();}});};
$('detachCompose').onclick=()=>{floating=!floating;$('compose').classList.toggle('floating',floating);$('detachCompose').innerHTML=floating?"<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M14 3v18m-6-9h5m-3-3 3 3-3 3\"/></svg>":"<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"8\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M14 3h7v7M21 3l-9 9\"/></svg>";$('columns').classList.toggle('wide',floating||!['inbox','outbox','requests'].includes(view));$('detachCompose').setAttribute('aria-label',floating?'Dock composer':'Float composer');$('detachCompose').title=floating?'Dock composer':'Float composer';if(!floating){$('compose').style.left='';$('compose').style.top='';$('compose').style.width='';$('compose').style.height='';}};
let drag;
$('composeHandle').onpointerdown=e=>{if(!floating||e.target.closest('button')||e.button!==0)return;const box=$('compose').getBoundingClientRect();drag={x:e.clientX-box.left,y:e.clientY-box.top};$('composeHandle').setPointerCapture(e.pointerId);e.preventDefault();};
$('composeHandle').onpointermove=e=>{if(!drag)return;const box=$('compose').getBoundingClientRect();$('compose').style.left=Math.max(0,Math.min(innerWidth-Math.min(box.width,innerWidth),e.clientX-drag.x))+'px';$('compose').style.top=Math.max(0,Math.min(innerHeight-50,e.clientY-drag.y))+'px';};
$('composeHandle').onpointerup=()=>{drag=null;};$('composeHandle').onpointercancel=()=>{drag=null;};
$('pushHeader').onclick=()=>confirmAction('Push this branch?','This publishes all local commits on this branch to '+state.config.gitRemote+(state.publicationHold?' and releases the publication pause.':'.'),()=>mutate('sync',{operation:'push',releaseHold:state.publicationHold}));
$('autoPushHeader').onchange=()=>{const enabled=$('autoPushHeader').checked;const apply=()=>mutate('settings',{version:state.configVersion,releaseHold:enabled&&state.publicationHold,settings:{autoPush:enabled,...(enabled?{autoCommit:true,syncAfterWrite:true}:{})}});if(enabled)confirmAction('Enable automatic push?','Dashboard changes will be committed and pushed after saving. All ahead commits on this branch are published. '+(state.publicationHold?'The existing publication pause will be released.':''),apply);else apply();};
function draftKey(){return 'saga-draft:'+location.host+':'+state?.workspaceRoot+':'+state?.branch+':'+(state?.config.identity||'');}
function saveDraft(){if(state?.config)localStorage.setItem(draftKey(),JSON.stringify({text:$('message').value,title:$('subject').value,to:$('recipient').value,kind:$('kind').value,priority:$('priority').value,replyTo}));}
['message','subject','recipient','kind','priority'].forEach(id=>$(id).addEventListener('input',saveDraft));
$('task').onclick=()=>{$('message').value+=($('message').value?'\n':'')+'- [ ] ';saveDraft();$('message').focus();};
function clearReply(){replyTo=null;$('replyHint').textContent='Send from your configured identity.';$('cancelReply').hidden=true;}
$('cancelReply').onclick=()=>{clearReply();saveDraft();};
$('send').onclick=async()=>{const draft={text:$('message').value,title:$('subject').value,to:$('recipient').value,kind:$('kind').value,priority:$('priority').value,replyTo};saveDraft();const key=draftKey();localStorage.setItem(key+':last-send',JSON.stringify({...draft,savedAt:new Date().toISOString()}));const f=state.messages.find(r=>r.meta.from===state.config.identity&&r.meta.kind!=='receipt');if(await mutate('message',{to:draft.to,title:draft.title,text:draft.text,kind:draft.kind,priority:draft.priority,reply_to:draft.replyTo,version:f?.fileVersion??state.outboxVersion??null})){if($('message').value===draft.text&&$('subject').value===draft.title){$('message').value='';$('subject').value='';clearReply();localStorage.removeItem(key);}notice(state.config.autoCommit?'Message committed locally. See Your outbox and the Git status for publication.':'Message saved to your outbox. Commit and push it to publish.');}};

$('feed').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.edit){editing=state.messages.find(r=>r.meta.id===b.dataset.edit);$('editBody').value=editing.body;$('editor').showModal();}
 if(b.dataset.close){const r=state.messages.find(r=>r.meta.id===b.dataset.close);confirmAction('Close and remove this message?','The message will leave your outbox. Git keeps its history. No recipient receipt is required for this owner action.',()=>mutate('update',{id:r.meta.id,sha256:r.sha256,delete:true}));}
 if(b.dataset.reply){const r=state.messages.find(r=>r.meta.id===b.dataset.reply);replyTo=r.meta.id;$('recipient').value=r.meta.from;$('subject').value='Re: '+r.meta.title;$('kind').value='reply';$('replyHint').textContent='Replying to '+r.meta.id;$('cancelReply').hidden=false;saveDraft();$('message').focus();}
 if(b.dataset.approve){const a=state.candidates.find(c=>c.receipt.meta.id===b.dataset.approve);const fn=()=>mutate('cleanup',{receiptIds:[a.receipt.meta.id],expected:{[a.receipt.meta.id]:a.request.sha256}});if(state.config.confirmCleanup)confirmAction('Approve completion and clean up?','This removes your request and consumes its matching completion receipts.',fn);else fn();}
 if(b.dataset.dismiss){const r=state.candidates.find(c=>c.receipt.meta.id===b.dataset.dismiss).receipt;const fn=()=>mutate('receipt-dismiss',{id:r.meta.id,sha256:r.sha256});if(state.config.confirmCleanup)confirmAction('Dismiss this receipt?','Only the receipt is removed. The original request stays in its owner’s outbox.',fn);else fn();}
 if(b.id==='previousPage'){pageIndex--;render();}if(b.id==='nextPage'){pageIndex++;render();}
 if(b.id==='addParticipant'){$('participantRows').insertAdjacentHTML('beforeend',participantRow());}
 if(b.hasAttribute('data-remove-participant'))b.closest('.participant-row').remove();
 if(b.id==='openWorkspace'){const fn=()=>mutate('workspace',{root:$('setting-root').value});if(!state.setupRequired&&$('setting-root').value!==state.workspaceRoot)confirmAction('Open another repository?','Mailbox data stays in its current repository.',fn);else fn();}
 if(b.id==='initializeWorkspace'){try{const config={schema:1,title:$('setting-setupTitle').value,identity:$('setting-setupIdentity').value,participants:JSON.parse($('setupParticipants').value),mailboxDirectory:$('setting-setupDirectory').value,cleanup:'approval'};mutate('workspace',{root:$('setting-root').value,initialize:true,config});}catch(e){notice(e.message);}}
 if(b.id==='pullNow'||b.id==='pushNow'){const operation=b.id==='pullNow'?'pull':'push';const fn=async()=>{try{await api('sync',{operation,releaseHold:operation==='push'&&state.publicationHold});await refresh(true);}catch(e){notice(e.message);}};if(operation==='push')confirmAction('Push pending commits?','This publishes all ahead commits on the configured branch and remote.',fn);else fn();}
 if(b.dataset.history){try{const x=await api('history',{commit:b.dataset.history,file:b.dataset.file,before:b.dataset.before==='true'});const pre=$('snapshot-'+b.dataset.history);pre.hidden=false;pre.textContent=x.text;}catch(e){notice(e.message);}}
};
$('feed').onsubmit=e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();try{const settings=collectSettings();const fn=()=>mutate('settings',{settings,version:state.configVersion,releaseHold:settings.autoPush&&state.publicationHold});const enabling=(settings.autoPush&&(!state.config.autoPush||state.publicationHold))||(settings.cleanup==='automatic'&&state.config.cleanup!=='automatic');if(enabling)confirmAction('Enable these automatic actions?','The selected Git and receipt actions will run according to these settings. Enabling automatic push releases any existing publication pause.',fn);else fn();}catch(err){notice(err.message);}};
$('feed').onchange=e=>{const t=e.target;if(t.dataset.check){const r=state.messages.find(r=>r.meta.id===t.dataset.check);t.disabled=true;mutate('update',{id:r.meta.id,sha256:r.sha256,line:Number(t.dataset.line),checked:t.checked});}if(t.dataset.status){const r=state.messages.find(r=>r.meta.id===t.dataset.status);mutate('update',{id:r.meta.id,sha256:r.sha256,status:t.value});}};
$('cancelEdit').onclick=()=>$('editor').close();$('saveEdit').onclick=async()=>{if(await mutate('update',{id:editing.meta.id,sha256:editing.sha256,text:$('editBody').value}))$('editor').close();};
$('refreshButton').onclick=()=>refresh(true);
$('syncButton').onclick=async()=>{if(busy){notice('Finish the current action before synchronizing.');return;}$('syncButton').disabled=true;$('syncButton').textContent='Synchronizing…';try{const ok=await mutate('sync',{});if(ok)notice(state.sync.message);}finally{$('syncButton').disabled=false;$('syncButton').textContent='Sync now';}};
function loadDraft(){try{let raw=localStorage.getItem(draftKey());const old='exchange-draft:'+location.host+':'+(state?.config.identity||'');if(!raw){raw=localStorage.getItem(old);if(raw){localStorage.setItem(draftKey(),raw);localStorage.removeItem(old);}}const d=JSON.parse(raw||'null');$('message').value=d?.text||'';$('subject').value=d?.title||'';$('recipient').value=d?.to||$('recipient').value;$('kind').value=d?.kind||state.config.defaultKind;$('priority').value=d?.priority||state.config.defaultPriority;clearReply();replyTo=d?.replyTo||null;if(replyTo){$('replyHint').textContent='Replying to '+replyTo;$('cancelReply').hidden=false;}}catch(e){notice('Could not restore draft: '+e.message);}finally{$('compose').inert=false;}}
let fileContext=null,fileSequence=0;
$('closeFile').onclick=()=>{fileSequence++;$('fileViewer').close();};
$('fileViewer').addEventListener('cancel',()=>{fileSequence++;});
document.addEventListener('click',async e=>{
 const link=e.target.closest('a[data-file-path]');if(!link)return;e.preventDefault();
 const context=link.closest('#fileContent')?fileContext:{workspaceRoot:state.workspaceRoot,branch:state.branch};
 const sequence=++fileSequence,path=link.dataset.filePath,isPdf=/\.pdf$/i.test(path);
 const tab=isPdf?window.open('about:blank','_blank'):null;if(tab)tab.opener=null;
 $('fileTitle').textContent=path;$('fileContext').textContent=context.branch+' · Read only';$('fileContent').textContent='Loading…';if(!$('fileViewer').open)$('fileViewer').showModal();
 try{
  const file=await api('file',{path,workspaceRoot:context.workspaceRoot,branch:context.branch});
  if(file.type==='pdf'&&tab){tab.location.href=file.url;if(sequence===fileSequence)$('fileViewer').close();return;}
  if(sequence!==fileSequence)return;
  fileContext=file;
  if(file.type==='pdf'){const a=document.createElement('a');a.href=file.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open PDF in a new tab';$('fileContent').replaceChildren(a);}
  else{$('fileContent').innerHTML=renderMarkdown(file.text,null,false,file);$('fileContent').scrollTop=0;}
 }catch(error){if(tab)tab.close();if(sequence===fileSequence)$('fileContent').textContent=error.message;}
});
refresh();
</script></body></html>
