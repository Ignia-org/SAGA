<style>
:root{font:14px 'Segoe UI',system-ui,sans-serif;color:#243b34;background:#f3f5f3;--ink:#164e3b;--muted:#71837a;--line:#dbe4dc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 13px}button:hover{background:#e9f1e9}button:disabled{opacity:.5;cursor:default}.primary{color:#fff;background:var(--ink);border-color:var(--ink)}.primary:hover{background:#226548}header{display:flex;justify-content:space-between;align-items:center;padding:22px 30px;background:#163d31;color:#fff;gap:24px}header h1{font-size:21px;margin:0}header p{color:#b5cec0;margin:6px 0 0}.sync{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:650px;margin-top:6px}.sync.error{color:#ffcca3}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 96px)}aside{background:#fff;border-right:1px solid var(--line);padding:25px 14px}aside button{display:block;width:100%;text-align:left;margin:4px 0;border:0;padding:13px}aside button.active{background:#e5eee6;color:var(--ink);font-weight:600}.caption{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}main{padding:28px 32px;max-width:1500px;width:100%;margin:0 auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px}h2{font-size:25px;margin:0 0 7px}.muted,.hint{color:var(--muted);font-size:12px;line-height:1.6}.stats{display:flex;gap:14px;margin:22px 0}.stat{background:white;border:1px solid var(--line);padding:17px 21px;border-radius:10px;flex:1}.stat strong{display:block;font-size:25px}.toolbar{display:flex;gap:9px;margin:20px 0;align-items:center;flex-wrap:wrap}input,select,textarea{border:1px solid #cbd9ce;background:#fff;border-radius:7px;padding:10px;min-width:0}#search{flex:1;min-width:180px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}.card summary{padding:17px 19px;cursor:pointer;line-height:1.6;font-weight:600}.tag{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:7px}.badge{display:inline-block;padding:2px 7px;background:#edf3ee;border-radius:5px;margin-right:5px;font-size:11px;font-weight:500}.badge.warn{background:#fff0db;color:#966229}.body{padding:0 19px 18px;line-height:1.7;overflow-wrap:anywhere}.body p{white-space:pre-wrap;margin:5px 0}.body h3{font-size:15px}.task{display:flex;align-items:start;gap:9px;margin:7px 0}.task input{margin-top:6px}.done{color:var(--muted);text-decoration:line-through}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.compose{padding:20px;position:sticky;top:20px}.compose h3{margin:0 0 5px}.compose input,.compose select,.compose textarea{width:100%;margin:8px 0}.compose textarea{height:170px;resize:vertical;line-height:1.6}.pair{display:flex;gap:8px}.notice{display:none;white-space:pre-wrap;padding:14px;background:#fff1df;border-radius:8px;margin:16px 0}.empty{padding:34px;text-align:center;color:var(--muted)}.panel{padding:22px}.panel h3{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;line-height:1.7;background:#f4f6f3;padding:16px;border-radius:8px}dialog{border:1px solid var(--line);border-radius:12px;width:min(680px,95vw);color:inherit;padding:26px}dialog::backdrop{background:#142e2580}dialog textarea{width:100%;min-height:240px}label{font-size:13px}.replies{border-left:3px solid #c9dccc;padding-left:15px;margin-top:18px}.wide{grid-template-columns:1fr}.danger{color:#994a3c}[hidden]{display:none!important}@media(max-width:1000px){.columns{grid-template-columns:1fr}.compose{position:static}}@media(max-width:650px){header{padding:18px}.shell{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px}aside button{width:auto;white-space:nowrap}aside .caption,aside .hint{display:none}main{padding:18px}.stats{gap:6px}.stat{padding:12px}.stat strong{font-size:21px}}
header button{color:var(--ink)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.setting-field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.setting-field input,.setting-field select{width:100%}.setting-toggle{display:flex;gap:12px;align-items:start;margin:16px 0}.setting-toggle input{margin-top:4px}.setting-toggle .hint{display:block}.participant-row{display:grid;grid-template-columns:140px 1fr 1fr auto;gap:8px;margin:10px 0}.settings-save{position:sticky;bottom:0;padding:16px;background:#f3f5f3;display:flex;gap:14px;align-items:center;border-top:1px solid var(--line)}#setupParticipants{min-height:180px}.setting-field textarea{width:100%}@media(max-width:650px){.settings-grid{grid-template-columns:1fr}.participant-row{grid-template-columns:1fr 1fr}.settings-save{flex-wrap:wrap}}
</style></head><body>
<header><div><h1 id="workspace">SAGA</h1><p>Requests, decisions, and follow-through.</p></div><div><button id="refreshButton">Refresh</button> <button id="syncButton">↻ Sync now</button><div id="sync" class="sync" role="status">Connecting…</div></div></header>
<div class="shell"><aside id="navigation"><p class="caption">Your workspace</p><button data-view="inbox">Inbox</button><button data-view="outbox">Your outbox</button><button data-view="approvals">Completion review</button><p class="caption" style="margin-top:28px">Observe</p><button data-view="monitor">Participant monitoring</button><button data-view="history">Git history</button><button data-view="settings">Settings</button><p class="hint" id="identity"></p></aside>
<main><div class="heading"><div><h2 id="title">Inbox</h2><div class="muted" id="subtitle"></div></div><span id="branch" class="muted"></span></div><div id="notice" class="notice" role="alert"></div><div class="stats" id="stats"></div>
<div class="toolbar" id="toolbar"><input id="search" placeholder="Search messages…" aria-label="Search"><select id="participant" aria-label="Filter participant"></select><select id="status" aria-label="Filter status"><option value="all">All statuses</option><option>untriaged</option><option>open</option><option>in_progress</option><option>waiting</option><option>blocked</option><option>done</option></select><button id="taskFilter">Tasks only</button></div>
<div class="columns" id="columns"><section id="feed"></section><section class="card compose" id="compose"><h3>New message</h3><p class="hint" id="replyHint">Send from your configured identity.</p><select id="recipient" aria-label="Recipient"></select><input id="subject" placeholder="Subject" maxlength="200" aria-label="Subject"><div class="pair"><select id="kind" aria-label="Message kind"><option>request</option><option>question</option><option>decision</option><option>report</option><option>reply</option></select><select id="priority" aria-label="Priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></div><textarea id="message" placeholder="Write a message…&#10;&#10;- [ ] A task to follow" aria-label="Message body"></textarea><div class="actions"><button id="task">+ Task</button><button id="cancelReply" hidden>Cancel reply</button><button class="primary" id="send">Send</button></div><p class="hint" id="savePolicy"></p></section></div></main></div>
<dialog id="editor"><h3>Edit your message</h3><p class="hint">Editing invalidates any completion receipt for an older version.</p><textarea id="editBody" aria-label="Edit message"></textarea><div class="actions"><button id="cancelEdit">Cancel</button><button id="saveEdit" class="primary">Save and commit</button></div></dialog>
<dialog id="confirmation"><h3 id="confirmTitle"></h3><p id="confirmText"></p><div class="actions"><button id="cancelConfirm">Cancel</button><button id="acceptConfirm" class="primary">Confirm</button></div></dialog>
<script src="/settings.js"></script>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id);let state,view='inbox',busy=false,signature='',tasksOnly=false,replyTo=null,editing=null,confirmation=null,historyState=null,refreshTimer=null,pageIndex=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=id=>state.config.participants.find(p=>p.id===id)?.label||id;
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const date=s=>new Date(s).toLocaleString('en-GB',{timeZone:state.config.timeZone});
async function api(route,data){const r=await fetch('/api/'+route,{method:data!==undefined?'POST':'GET',headers:{'X-Dashboard-Token':token,...(data!==undefined?{'Content-Type':'application/json'}:{})},body:data!==undefined?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error);return x;}
function notice(s){$('notice').textContent=s;$('notice').style.display=s?'block':'none';}
function choices(id,people,all=false){const old=$(id).value;$(id).innerHTML=(all?'<option value="all">All participants</option>':'')+people.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');if([...$(id).options].some(o=>o.value===old))$(id).value=old;}
function body(text,record=null,editable=false){return text.split('\n').map((line,i)=>{const t=line.match(/^\s*[-*+] \[([ xX])\] (.*)/);if(t)return `<label class="task ${t[1]!==' '?'done':''}"><input type="checkbox" ${t[1]!==' '?'checked':''} ${editable?'data-check="'+esc(record.meta.id)+'" data-line="'+i+'"':'disabled'}><span>${inline(t[2])}</span></label>`;if(/^###? /.test(line))return '<h3>'+inline(line.replace(/^#+ /,''))+'</h3>';return '<p>'+inline(line)+'</p>';}).join('');}
function messageCard(r,open=false,nested=false){const m=r.meta,own=m.from===state.config.identity,editable=own&&view!=='monitor',replies=nested?[]:state.messages.filter(x=>x.meta.reply_to===m.id&&x.meta.kind!=='receipt');return `<details class="card" ${open?'open':''}><summary><span class="tag">${esc(label(m.from))} → ${esc(label(m.to))} · ${date(m.created)}</span><span class="badge">${esc(m.kind)}</span><span class="badge">${esc(m.status.replaceAll('_',' '))}</span>${m.priority!=='normal'?'<span class="badge warn">'+esc(m.priority)+'</span>':''}<br>${inline(m.title)}</summary><div class="body">${body(r.body,r,editable)}<p class="hint">${esc(m.id)}${m.reply_to?' · reply to '+esc(m.reply_to):''}</p><div class="actions">${editable?`<button data-edit="${esc(m.id)}">Edit</button><select data-status="${esc(m.id)}" aria-label="Message status">${['untriaged','open','in_progress','waiting','blocked','done'].map(s=>'<option '+(s===m.status?'selected':'')+'>'+s+'</option>').join('')}</select><button class="danger" data-close="${esc(m.id)}">Close and remove</button>`:m.to===state.config.identity&&view!=='monitor'?`<button data-reply="${esc(m.id)}">Reply</button>`:''}</div>${replies.length?'<div class="replies"><p class="caption">Replies</p>'+replies.map(x=>messageCard(x,false,true)).join('')+'</div>':''}</div></details>`;}
function matches(r){const p=$('participant').value,q=$('search').value.toLowerCase(),s=$('status').value;return (p==='all'||[r.meta.from,r.meta.to].includes(p))&&(s==='all'||r.meta.status===s)&&(!tasksOnly||/^\s*[-*+] \[[ xX]\]/m.test(r.body))&&(r.meta.title+' '+r.body+' '+r.meta.id).toLowerCase().includes(q);}
function render(){
 if(state.setupRequired){document.title='SAGA';$('workspace').textContent='SAGA';$('title').textContent='Set up your workspace';$('subtitle').textContent='Choose the repository holding your messages.';$('navigation').hidden=true;$('stats').innerHTML='';$('toolbar').hidden=true;$('compose').hidden=true;$('columns').classList.add('wide');$('feed').innerHTML=renderSetup();return;}
 $('navigation').hidden=false;
 const c=state.config,me=c.identity;$('savePolicy').textContent=(c.autoCommit?'Changes are committed automatically.':'Changes are saved to files; commit them when ready.')+' Drafts stay in this browser.';$('saveEdit').textContent=c.autoCommit?'Save and commit':'Save changes';document.title='SAGA · '+c.title;$('workspace').textContent='SAGA / '+c.title;$('identity').textContent='Operating as '+label(me);$('branch').textContent='Branch: '+state.branch;
 const titles={inbox:['Inbox','Messages addressed to you. Completion receipts appear in Completion review.'],outbox:['Your outbox','You own these requests and decide when to remove them.'],approvals:['Completion review','Receipts certify an exact message version. Review the work before cleanup.'],monitor:['Participant monitoring','Read-only exchanges between other participants.'],history:['Git history','Inspect mailbox snapshots before or after a commit.'],settings:['Settings','Configure this workspace and every automatic action.']};
 $('title').textContent=titles[view][0];$('subtitle').textContent=titles[view][1];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 choices('participant',c.participants,true);choices('recipient',c.participants.filter(p=>p.id!==me));const outgoing=state.messages.filter(r=>r.meta.from===me&&r.meta.kind!=='receipt'),incoming=state.messages.filter(r=>r.meta.to===me&&r.meta.kind!=='receipt'),ready=state.candidates.filter(r=>r.eligible);
 document.querySelector('[data-view="monitor"]').hidden=!c.showMonitoring;
 $('stats').innerHTML=[[incoming.length,'inbox messages'],[outgoing.length,'outbox messages'],[ready.length,'completed requests'],[state.errors.length,'format errors']].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span class="muted">${t}</span></div>`).join('');
 const showCompose=['inbox','outbox'].includes(view);$('compose').hidden=!showCompose;$('columns').classList.toggle('wide',!showCompose);$('toolbar').hidden=!['inbox','outbox','monitor'].includes(view);$('taskFilter').classList.toggle('primary',tasksOnly);
 if(state.errors.length)notice(state.errors.join('\n'));
 if(view==='settings'){$('feed').innerHTML=renderSettings(c);return;}
 if(view==='approvals'){$('feed').innerHTML='<p class="hint">Cleanup policy: '+esc(c.cleanup)+'. Each receipt includes the agent’s completion summary.</p>'+state.candidates.map(a=>`<details class="card" open><summary><span class="tag">${esc(label(a.receipt.meta.from))} · ${date(a.receipt.meta.created)}</span>${inline(a.request?.meta.title||a.receipt.meta.title)} <span class="badge ${a.eligible?'':'warn'}">${a.eligible?'Ready for cleanup':esc(a.reason)}</span></summary><div class="body"><p class="caption">Completion summary</p>${body(a.receipt.body)}${a.request?'<details><summary>Original request</summary>'+body(a.request.body)+'</details>':''}<div class="actions">${a.eligible&&c.cleanup!=='off'?'<button class="primary" data-approve="'+esc(a.receipt.meta.id)+'">Approve and clean up</button>':''}<button data-dismiss="${esc(a.receipt.meta.id)}">Dismiss receipt</button></div></div></details>`).join('');if(!state.candidates.length)$('feed').innerHTML+='<div class="card empty">No completion receipts yet.</div>';return;}
 if(view==='history'){renderHistory();return;}
 const records=(view==='inbox'?incoming:view==='outbox'?outgoing:state.messages.filter(r=>r.meta.from!==me&&r.meta.to!==me)).filter(matches).sort((a,b)=>b.meta.created.localeCompare(a.meta.created));
 const pages=Math.max(1,Math.ceil(records.length/c.pageSize));pageIndex=Math.min(pageIndex,pages-1);
 $('feed').innerHTML=records.slice(pageIndex*c.pageSize,(pageIndex+1)*c.pageSize).map((r,i)=>messageCard(r,i<c.defaultExpanded)).join('')+(records.length>c.pageSize?'<div class="actions"><button id="previousPage" '+(pageIndex===0?'disabled':'')+'>Previous</button><span class="hint">Page '+(pageIndex+1)+' of '+pages+' · '+records.length+' messages</span><button id="nextPage" '+(pageIndex===pages-1?'disabled':'')+'>Next</button></div>':'');if(!$('feed').innerHTML)$('feed').innerHTML='<div class="card empty">No messages match this view.</div>';
}
function renderHistory(){if(!historyState){$('feed').innerHTML='<div class="card empty">Loading history…</div>';return;}$('feed').innerHTML=historyState.commits.map(c=>`<section class="card panel"><span class="tag">${date(c.date)} · ${esc(c.commit.slice(0,8))}</span><strong>${esc(c.title)}</strong>${c.files.map(f=>`<p class="hint">${esc(f)}</p><button data-history="${esc(c.commit)}" data-file="${esc(f)}" data-before="true">Before</button> <button data-history="${esc(c.commit)}" data-file="${esc(f)}">After</button>`).join('')}<pre id="snapshot-${esc(c.commit)}" hidden></pre></section>`).join('')||'<div class="card empty">No structured mailbox history yet.</div>';}
async function refresh(force=false){try{const next=await api('state');const status=next.sync||{message:'Choose a repository'};$('sync').textContent=status.message+(status.last?' · '+new Date(status.last).toLocaleTimeString('en-GB'):'');$('sync').classList.toggle('error',status.state==='error');const key=next.setupRequired?JSON.stringify(next):JSON.stringify([next.configVersion,next.messages.map(r=>r.sha256),next.errors]);const changedIdentity=state?.config?.identity!==next.config?.identity;state=next;if(changedIdentity&&next.config){$('kind').value=next.config.defaultKind;$('priority').value=next.config.defaultPriority;pageIndex=0;}if(force||key!==signature){signature=key;render();}}catch(e){notice(e.message);}finally{scheduleRefresh();}}
function scheduleRefresh(){clearTimeout(refreshTimer);if(state?.config?.refreshSeconds>0)refreshTimer=setTimeout(()=>{if(!busy)refresh();else scheduleRefresh();},state.config.refreshSeconds*1000);}
async function mutate(route,data){if(busy)return false;busy=true;$('send').disabled=true;notice('');try{await api(route,data);historyState=null;return true;}catch(e){notice(e.message);return false;}finally{busy=false;$('send').disabled=false;await refresh(true);}}
function confirmAction(title,text,fn){confirmation=fn;$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmation').showModal();}
$('cancelConfirm').onclick=()=>{$('confirmation').close();confirmation=null;};$('acceptConfirm').onclick=()=>{$('confirmation').close();const fn=confirmation;confirmation=null;fn?.();};
$('navigation').onclick=async e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;pageIndex=0;render();if(view==='history'){try{historyState=await api('history',{});if(view==='history')renderHistory();}catch(e){notice(e.message);}}};
$('search').oninput=()=>{pageIndex=0;render();};$('participant').onchange=()=>{pageIndex=0;render();};$('status').onchange=()=>{pageIndex=0;render();};$('taskFilter').onclick=()=>{tasksOnly=!tasksOnly;render();};
function draftKey(){return 'exchange-draft:'+location.host+':'+(state?.config.identity||'');}
function saveDraft(){if(state)localStorage.setItem(draftKey(),JSON.stringify({text:$('message').value,title:$('subject').value,to:$('recipient').value,kind:$('kind').value,priority:$('priority').value,replyTo}));}
['message','subject','recipient','kind','priority'].forEach(id=>$(id).addEventListener('input',saveDraft));
$('task').onclick=()=>{$('message').value+=($('message').value?'\n':'')+'- [ ] ';saveDraft();$('message').focus();};
function clearReply(){replyTo=null;$('replyHint').textContent='Send from your configured identity.';$('cancelReply').hidden=true;}
$('cancelReply').onclick=()=>{clearReply();saveDraft();};
$('send').onclick=async()=>{const f=state.messages.find(r=>r.meta.from===state.config.identity&&r.meta.kind!=='receipt');if(await mutate('message',{to:$('recipient').value,title:$('subject').value,text:$('message').value,kind:$('kind').value,priority:$('priority').value,reply_to:replyTo,version:f?.fileVersion??state.outboxVersion??null})){$('message').value='';$('subject').value='';clearReply();localStorage.removeItem(draftKey());}};
$('feed').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.edit){editing=state.messages.find(r=>r.meta.id===b.dataset.edit);$('editBody').value=editing.body;$('editor').showModal();}
 if(b.dataset.close){const r=state.messages.find(r=>r.meta.id===b.dataset.close);confirmAction('Close and remove this message?','The message will leave your outbox. Git keeps its history. No recipient receipt is required for this owner action.',()=>mutate('update',{id:r.meta.id,sha256:r.sha256,delete:true}));}
 if(b.dataset.reply){const r=state.messages.find(r=>r.meta.id===b.dataset.reply);replyTo=r.meta.id;$('recipient').value=r.meta.from;$('subject').value='Re: '+r.meta.title;$('kind').value='reply';$('replyHint').textContent='Replying to '+r.meta.id;$('cancelReply').hidden=false;saveDraft();$('message').focus();}
 if(b.dataset.approve){const a=state.candidates.find(c=>c.receipt.meta.id===b.dataset.approve);const fn=()=>mutate('cleanup',{receiptIds:[a.receipt.meta.id],expected:{[a.receipt.meta.id]:a.request.sha256}});if(state.config.confirmCleanup)confirmAction('Approve completion and clean up?','This removes your request and consumes its matching completion receipts.',fn);else fn();}
 if(b.dataset.dismiss){const r=state.candidates.find(c=>c.receipt.meta.id===b.dataset.dismiss).receipt;const fn=()=>mutate('receipt-dismiss',{id:r.meta.id,sha256:r.sha256});if(state.config.confirmCleanup)confirmAction('Dismiss this receipt?','Only the receipt is removed. The original request stays in its owner’s outbox.',fn);else fn();}
 if(b.id==='previousPage'){pageIndex--;render();}if(b.id==='nextPage'){pageIndex++;render();}
 if(b.id==='addParticipant'){$('participantRows').insertAdjacentHTML('beforeend',participantRow());}
 if(b.hasAttribute('data-remove-participant'))b.closest('.participant-row').remove();
 if(b.id==='openWorkspace'){const fn=()=>mutate('workspace',{root:$('setting-root').value});if(!state.setupRequired&&$('setting-root').value!==state.workspaceRoot)confirmAction('Open another repository?','Mailbox data stays in its current repository.',fn);else fn();}
 if(b.id==='initializeWorkspace'){try{const config={schema:1,title:$('setting-setupTitle').value,identity:$('setting-setupIdentity').value,participants:JSON.parse($('setupParticipants').value),mailboxDirectory:$('setting-setupDirectory').value,cleanup:'approval'};mutate('workspace',{root:$('setting-root').value,initialize:true,config});}catch(e){notice(e.message);}}
 if(b.id==='pullNow'||b.id==='pushNow'){const operation=b.id==='pullNow'?'pull':'push';const fn=async()=>{try{await api('sync',{operation});await refresh(true);}catch(e){notice(e.message);}};if(operation==='push')confirmAction('Push pending commits?','This publishes all ahead commits on the configured branch and remote.',fn);else fn();}
 if(b.dataset.history){try{const x=await api('history',{commit:b.dataset.history,file:b.dataset.file,before:b.dataset.before==='true'});const pre=$('snapshot-'+b.dataset.history);pre.hidden=false;pre.textContent=x.text;}catch(e){notice(e.message);}}
};
$('feed').onsubmit=e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();try{const settings=collectSettings();const fn=()=>mutate('settings',{settings,version:state.configVersion});const enabling=(settings.autoPush&&!state.config.autoPush)||(settings.cleanup==='automatic'&&state.config.cleanup!=='automatic');if(enabling)confirmAction('Enable these automatic actions?','The selected Git and receipt actions will run according to these settings.',fn);else fn();}catch(err){notice(err.message);}};
$('feed').onchange=e=>{const t=e.target;if(t.dataset.check){const r=state.messages.find(r=>r.meta.id===t.dataset.check);t.disabled=true;mutate('update',{id:r.meta.id,sha256:r.sha256,line:Number(t.dataset.line),checked:t.checked});}if(t.dataset.status){const r=state.messages.find(r=>r.meta.id===t.dataset.status);mutate('update',{id:r.meta.id,sha256:r.sha256,status:t.value});}};
$('cancelEdit').onclick=()=>$('editor').close();$('saveEdit').onclick=async()=>{if(await mutate('update',{id:editing.meta.id,sha256:editing.sha256,text:$('editBody').value}))$('editor').close();};
$('refreshButton').onclick=()=>refresh(true);
$('syncButton').onclick=async()=>{if(busy)return;$('syncButton').disabled=true;try{await api('sync',{});await refresh(true);}catch(e){notice(e.message);}finally{$('syncButton').disabled=false;}};
refresh().then(()=>{if(!state)return;try{const d=JSON.parse(localStorage.getItem(draftKey())||'null');if(d){$('message').value=d.text||'';$('subject').value=d.title||'';$('recipient').value=d.to||$('recipient').value;$('kind').value=d.kind||'request';$('priority').value=d.priority||'normal';replyTo=d.replyTo||null;if(replyTo){$('replyHint').textContent='Replying to '+replyTo;$('cancelReply').hidden=false;}}}catch{}});
</script></body></html>
